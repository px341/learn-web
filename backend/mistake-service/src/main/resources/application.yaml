server:
  port: 18084
spring:
  application:
    name: mistake-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:learn}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}
    publisher-confirm-type: correlated
    listener:
      simple:
        # 重试耗尽后拒绝原消息，由死信消费者把任务记录为 FAILED。
        default-requeue-rejected: false

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-handlers-package: com.learn.mistakeservice.mybatis

security:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-key-at-least-32-bytes}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}

# Garage 暴露 S3 兼容 API。服务端访问地址和浏览器访问地址必须分开配置，
# 否则 Docker 内部的 garage 主机名会被写进预签名 URL，导致浏览器无法访问。
storage:
  s3:
    endpoint: ${GARAGE_ENDPOINT:http://localhost:3900}
    public-endpoint: ${GARAGE_PUBLIC_ENDPOINT:http://localhost:3900}
    region: ${GARAGE_REGION:garage}
    bucket: ${GARAGE_BUCKET:mistake-images}
    access-key: ${GARAGE_ACCESS_KEY:GK0123456789abcdef0123456789abcdef}
    secret-key: ${GARAGE_SECRET_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    path-style-access: ${GARAGE_PATH_STYLE_ACCESS:true}
    presigned-url-ttl: ${GARAGE_PRESIGNED_URL_TTL:15m}

messaging:
  outbox:
    fixed-delay: ${OUTBOX_FIXED_DELAY:2s}
    initial-delay: ${OUTBOX_INITIAL_DELAY:30s}

analysis:
  lease-timeout: ${ANALYSIS_LEASE_TIMEOUT:10m}
  retry:
    initial-interval: ${ANALYSIS_RETRY_INITIAL_INTERVAL:2s}
    multiplier: ${ANALYSIS_RETRY_MULTIPLIER:2}
    max-interval: ${ANALYSIS_RETRY_MAX_INTERVAL:10s}
    max-attempts: ${ANALYSIS_RETRY_MAX_ATTEMPTS:3}
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.4}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:10s}
    read-timeout: ${OPENAI_READ_TIMEOUT:60s}
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:1200}
  recovery:
    fixed-delay: ${ANALYSIS_RECOVERY_FIXED_DELAY:1m}
    initial-delay: ${ANALYSIS_RECOVERY_INITIAL_DELAY:1m}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    try-it-out-enabled: true
