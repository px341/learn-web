server:
  port: 18081
  forward-headers-strategy: framework

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    gateway:
      server:
        webflux:
          routes:
            # 将统一文档地址改写为 Auth Service 自己的 OpenAPI 文档地址。
            - id: auth-service-openapi
              uri: lb://auth-service
              predicates:
                - Path=/v3/api-docs/auth-service
              filters:
                - SetPath=/v3/api-docs
            # 将统一文档地址改写为 Mistake Service 自己的 OpenAPI 文档地址。
            - id: mistake-service-openapi
              uri: lb://mistake-service
              predicates:
                - Path=/v3/api-docs/mistake-service
              filters:
                - SetPath=/v3/api-docs
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 5
                    redis-rate-limiter.requestedTokens: 1
            - id: mistake-service
              uri: lb://mistake-service
              predicates:
                - Path=/api/dashboard/**,/api/mistakes/**

security:
  jwt:
    # 本地开发默认值；共享环境必须通过 JWT_SECRET 注入至少 32 字节的随机密钥。
    secret: ${JWT_SECRET:change-this-dev-secret-key-at-least-32-bytes}

springdoc:
  # Swagger UI 的自动配置依赖该开关；页面只展示下方显式配置的微服务文档。
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    try-it-out-enabled: true
    # 在聚合 Swagger UI 刷新页面或切换服务后保留已授权的 JWT。
    persist-authorization: true
    urls:
      - name: auth-service
        url: /v3/api-docs/auth-service
      - name: mistake-service
        url: /v3/api-docs/mistake-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
