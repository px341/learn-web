server:
  port: 18085
spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:learn}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-handlers-package: com.learn.paymentservice.mybatis

security:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-key-at-least-32-bytes}

payment:
  mock:
    # 默认关闭；仅在本地或演示环境显式设置 PAYMENT_MOCK_ENABLED=true。
    enabled: ${PAYMENT_MOCK_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    try-it-out-enabled: true
