metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

# 本地单节点 Demo 不做副本；生产部署需要多节点和更高副本数。
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "garage-local-admin-token-change-before-production"
metrics_token = "garage-local-metrics-token-change-before-production"
