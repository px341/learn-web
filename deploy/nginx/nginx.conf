events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name learnweb.test localhost;

        root /usr/share/nginx/html;
        index index.html;

        # React Router history fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 所有 API 统一进入宿主机上的 Spring Cloud Gateway
        location /api/ {
            proxy_pass http://host.docker.internal:18081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 统一 API 调试入口：http://learnweb.test/swagger.html
        location = /swagger.html {
            proxy_pass http://host.docker.internal:18081/swagger-ui.html;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger UI 静态资源及各微服务聚合后的 OpenAPI 文档。
        location ~ ^/(swagger-ui|webjars|v3/api-docs)(/|$) {
            proxy_pass http://host.docker.internal:18081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
